name: Build release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "RELEASE_SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "Release signing secrets are not configured; building an unsigned debug APK." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "RELEASE_SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          keystore_path="$RUNNER_TEMP/ansit-release.keystore"
          signing_path="$RUNNER_TEMP/ansit-signing.properties"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          {
            printf 'storeFile=%s\n' "$keystore_path"
            printf 'storeType=PKCS12\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > "$signing_path"
          chmod 600 "$keystore_path" "$signing_path"
          echo "ANDROID_RELEASE_SIGNING_PROPERTIES=$signing_path" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -euo pipefail
          if [[ "$RELEASE_SIGNING_AVAILABLE" == "true" ]]; then
            gradle --no-daemon assembleRelease
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload signed release APK
        if: env.RELEASE_SIGNING_AVAILABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ansit-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug fallback APK
        if: env.RELEASE_SIGNING_AVAILABLE == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ansit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
